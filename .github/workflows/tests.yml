name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate the demo runs
        # The real signal CSVs are not in this repository. These stand in, so
        # the loader and the queries are exercised rather than skipped.
        run: python make_demo_runs.py

      - name: Load them and print what the queries say
        run: |
          python build_db.py --metadata demo_metadata.csv
          python run_queries.py

      - name: Tests
        run: python -m pytest -v
